<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | AirPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center px-6">

  <main class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

    <div class="flex items-center gap-3 font-bold text-xl mb-8">
      <div
        class="w-10 h-10 bg-gradient-to-br from-blue-500 to-emerald-500 rounded-xl flex items-center justify-center text-white">
        <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h10" />
          <path d="M9 18h3a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3h3" />
          <path d="M12 12a3 3 0 0 1 3 3v3" />
        </svg>
      </div>
      <span>Admin <span class="text-blue-600">Portal</span></span>
    </div>

    <p class="text-sm text-slate-500 mb-6">
      Sign in to review, approve or reject community pollution-source reports.
    </p>

    <div class="space-y-4">
      <div>
        <label for="username" class="text-xs text-slate-500 font-medium uppercase tracking-wider">Username</label>
        <input type="text" id="username" autocomplete="username"
          class="block w-full mt-1 px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>

      <div>
        <label for="password" class="text-xs text-slate-500 font-medium uppercase tracking-wider">Password</label>
        <input type="password" id="password" autocomplete="current-password"
          class="block w-full mt-1 px-4 py-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-blue-500 transition">
      </div>

      <div id="loginMessage" class="hidden rounded-xl px-4 py-3 text-sm font-semibold"></div>

      <button id="loginBtn"
        class="w-full bg-slate-900 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-600 transition shadow-lg shadow-slate-200">
        Sign in
      </button>
    </div>

    <p class="text-[11px] text-slate-400 mt-6 leading-relaxed">
      Set <code>ADMIN_USERNAME</code> and <code>ADMIN_PASSWORD</code> in <code>.env.local</code>.
      Never ship the default credentials to production.
    </p>

    <a href="index.html" class="block text-center text-xs font-bold text-slate-400 hover:text-blue-600 mt-6 transition">
      &larr; Back to site
    </a>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function message(text, ok) {
      const box = $("loginMessage");
      box.textContent = text;
      box.className = `rounded-xl px-4 py-3 text-sm font-semibold ${ok ? "bg-emerald-50 text-emerald-700" : "bg-red-50 text-red-700"}`;
    }

    async function login() {
      const button = $("loginBtn");
      button.disabled = true;
      button.textContent = "Signing in...";
      message("");

      try {
        const res = await fetch("/api/auth/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("username").value, password: $("password").value }),
        });
        const data = await res.json();

        if (!res.ok) {
          message(data.error || "Invalid credentials.", false);
          return;
        }

        sessionStorage.setItem("aqis_admin_token", data.token);
        window.location.href = "data.html";
      } catch (err) {
        message("Could not reach the server.", false);
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    }

    $("loginBtn").addEventListener("click", login);
    ["username", "password"].forEach((id) => $(id).addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    }));

    if (sessionStorage.getItem("aqis_admin_token")) {
      window.location.href = "data.html";
    }
  </script>
</body>

</html>
